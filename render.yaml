services:
  - type: web
    name: eduword-chain-game
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KOREAN_DICT_API_KEY
        sync: false

